poem_task:
  description: >
    Write one finished original poem from the inspirations below. Choose the
    form, line, and register that best fit the material. If additional user
    context is provided, treat it as a privileged compass inside the poem, not
    as disposable backstage instruction. Do not merely paraphrase, summarize, or
    rhyme the inputs. Transform them into a genuine poem with music, shape, and
    imaginative life.

    USER COMPASS:
    {enhance}

    IMAGE ANALYSIS:
    {image_analysis}
  expected_output: >
    One finished poem only. No explanation, no title unless the poem truly
    needs one, no notes, no markdown fences.
  agent: poem_writer
